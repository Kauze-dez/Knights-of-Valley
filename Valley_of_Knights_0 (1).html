  else if (k === 'Space') tryAttack();
    else if (k === 'KeyF') tryPickup();

var pad = { x: 0, y: 0, on: false, prev: {}, hold: 0 };
function pollPad(dt) {
  var gps = navigator.getGamepads ? navigator.getGamepads() : [], gp = null, i;
  for (i = 0; i < gps.length; i++) if (gps[i] && gps[i].connected) { gp = gps[i]; break; }
  pad.x = 0; pad.y = 0;
  if (!gp) { pad.on = false; pad.prev = {}; pad.rx = pad.ry = 0; return; }
  if (!pad.on) { pad.on = true; toast('Геймпад подключён'); }

    if (hit('x') || hit('start') || hit('back')) onKey(G.modal ? 'Escape' : 'KeyI');
